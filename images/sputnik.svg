<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" role="img" aria-labelledby="title">
  <title id="title">Sputnik 1</title>
  <defs>
    <radialGradient id="shell" cx="36%" cy="30%" r="78%">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.18" stop-color="#e8ecf3"/>
      <stop offset="0.5" stop-color="#a7b0c2"/>
      <stop offset="0.82" stop-color="#5a6378"/>
      <stop offset="1" stop-color="#3a4257"/>
    </radialGradient>
    <radialGradient id="earthglow" cx="22%" cy="88%" r="70%">
      <stop offset="0" stop-color="#4299e1" stop-opacity="0.65"/>
      <stop offset="1" stop-color="#4299e1" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="specular" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="rod" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e2e7ef"/>
      <stop offset="1" stop-color="#7a8398"/>
    </linearGradient>
    <linearGradient id="orbit" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#805ad5" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#805ad5" stop-opacity="0.7"/>
      <stop offset="1" stop-color="#38b2ac" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Stars -->
  <g fill="#f6ad55">
    <path d="M212 23 Q212 30 219 30 Q212 30 212 37 Q212 30 205 30 Q212 30 212 23 Z"/>
    <path d="M28 190 Q28 196 34 196 Q28 196 28 202 Q28 196 22 196 Q28 196 28 190 Z"/>
    <path d="M150 18 Q150 22 154 22 Q150 22 150 26 Q150 22 146 22 Q150 22 150 18 Z"/>
  </g>

  <!-- Orbit path -->
  <ellipse cx="120" cy="124" rx="114" ry="34" transform="rotate(-24 120 124)" fill="none" stroke="url(#orbit)" stroke-width="2.5" stroke-dasharray="2 7" stroke-linecap="round"/>

  <!-- Radio beep -->
  <g fill="none" stroke="#38b2ac" stroke-width="4" stroke-linecap="round">
    <path d="M22.3 63.5 A60 60 0 0 1 53.7 26.1" opacity="0.90"/><path d="M11.8 60.4 A71 71 0 0 1 48.9 16.2" opacity="0.62"/><path d="M1.2 57.4 A82 82 0 0 1 44.1 6.3" opacity="0.34"/>
  </g>

  <!-- Antennas -->
  <g fill="url(#rod)" stroke="#4a5266" stroke-width="0.6">
    <polygon points="124.3,93.5 229.5,106.7 229.7,105.1 125.0,88.8"/><polygon points="118.9,105.2 203.0,137.5 203.6,136.0 120.7,100.8"/><polygon points="109.3,116.1 193.8,180.1 194.8,178.8 112.3,112.3"/><polygon points="98.2,122.7 149.8,196.4 151.2,195.5 102.2,120.0"/>
  </g>
  <g fill="#cbd2de" stroke="#4a5266" stroke-width="0.8"><circle cx="229.6" cy="105.9" r="2.2"/><circle cx="203.3" cy="136.7" r="2.2"/><circle cx="194.3" cy="179.4" r="2.2"/><circle cx="150.5" cy="196.0" r="2.2"/></g>

  <!-- Sphere -->
  <circle cx="80" cy="80" r="47" fill="url(#shell)"/>
  <circle cx="80" cy="80" r="47" fill="url(#earthglow)"/>
  <!-- Rim light on the shadow side -->
  <path d="M124.5 70.5 A45.5 45.5 0 0 1 68.2 123.9" fill="none" stroke="#4fd1c5" stroke-width="2.5" stroke-linecap="round" opacity="0.75"/>
  <!-- Seam between hemispheres, with bolts -->
  <g transform="rotate(-32 80 80)">
    <path d="M33 80 A47 13 0 0 0 127 80" fill="none" stroke="#3a4257" stroke-width="3.2"/>
    <path d="M33 80 A47 13 0 0 0 127 80" fill="none" stroke="#dfe4ee" stroke-width="1" transform="translate(0 -2)" opacity="0.8"/>
    <g fill="#2d3348"><circle cx="125.4" cy="83.4" r="1.3"/><circle cx="120.7" cy="86.5" r="1.3"/><circle cx="113.2" cy="89.2" r="1.3"/><circle cx="103.5" cy="91.3" r="1.3"/><circle cx="92.2" cy="92.6" r="1.3"/><circle cx="80.0" cy="93.0" r="1.3"/><circle cx="67.8" cy="92.6" r="1.3"/><circle cx="56.5" cy="91.3" r="1.3"/><circle cx="46.8" cy="89.2" r="1.3"/><circle cx="39.3" cy="86.5" r="1.3"/><circle cx="34.6" cy="83.4" r="1.3"/></g>
  </g>
  <!-- Highlights -->
  <ellipse cx="62" cy="58" rx="19" ry="12" transform="rotate(-35 62 58)" fill="url(#specular)"/>
  <circle cx="58" cy="54" r="3.5" fill="#ffffff"/>

  <!-- Antenna mounts (drawn over the sphere edge) -->
  <g stroke="#3a4257" stroke-width="5.5" stroke-linecap="round"><line x1="124.6" y1="91.1" x2="131.6" y2="92.1"/><line x1="119.8" y1="103.0" x2="126.3" y2="105.6"/><line x1="110.8" y1="114.2" x2="116.3" y2="118.5"/><line x1="100.2" y1="121.3" x2="104.1" y2="127.1"/></g>
  <g stroke="#a7b0c2" stroke-width="2.5" stroke-linecap="round"><line x1="124.6" y1="91.1" x2="131.6" y2="92.1"/><line x1="119.8" y1="103.0" x2="126.3" y2="105.6"/><line x1="110.8" y1="114.2" x2="116.3" y2="118.5"/><line x1="100.2" y1="121.3" x2="104.1" y2="127.1"/></g>
</svg>

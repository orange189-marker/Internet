<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" role="img" aria-labelledby="title">
  <title id="title">Sputnik 1</title>
  <defs>
    <radialGradient id="shell" cx="38%" cy="32%" r="75%">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.25" stop-color="#dfe4ee"/>
      <stop offset="0.6" stop-color="#9aa3b5"/>
      <stop offset="1" stop-color="#4a5266"/>
    </radialGradient>
    <linearGradient id="rod" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#c9ced9"/>
      <stop offset="1" stop-color="#6b7385"/>
    </linearGradient>
  </defs>

  <!-- Four swept-back antennas -->
  <g stroke="url(#rod)" stroke-linecap="round" fill="none">
    <line x1="104" y1="96" x2="232" y2="168" stroke-width="2.5"/>
    <line x1="100" y1="102" x2="214" y2="204" stroke-width="2.5"/>
    <line x1="94" y1="106" x2="184" y2="230" stroke-width="2.5"/>
    <line x1="106" y1="90" x2="236" y2="134" stroke-width="2.5"/>
  </g>
  <!-- Antenna mounts -->
  <g fill="#5d6577">
    <circle cx="104" cy="96" r="3.5"/>
    <circle cx="100" cy="102" r="3.5"/>
    <circle cx="94" cy="106" r="3.5"/>
    <circle cx="106" cy="90" r="3.5"/>
  </g>

  <!-- Polished sphere -->
  <circle cx="80" cy="80" r="40" fill="url(#shell)"/>
  <!-- Seam between the two hemispheres -->
  <ellipse cx="80" cy="80" rx="40" ry="11" transform="rotate(-40 80 80)" fill="none" stroke="#5d6577" stroke-width="1.5" opacity="0.7"/>
  <!-- Specular highlight -->
  <ellipse cx="66" cy="62" rx="11" ry="7" transform="rotate(-35 66 62)" fill="#ffffff" opacity="0.75"/>
</svg>
